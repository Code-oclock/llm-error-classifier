services:
  ollama:
    image: ollama/ollama:0.40.17
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: "1"
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,ollama
    deploy:
      resources:
        limits:
          cpus: "${OLLAMA_CPUS:-4}"
          memory: ${OLLAMA_MEMORY:-8g}
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/11434'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  model-init:
    image: ollama/ollama:0.40.17
    restart: "no"
    entrypoint: ["sh", "-c", "ollama pull \"$$LLM_MODEL\""]
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:?set LLM_MODEL in .env}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,ollama
    depends_on:
      ollama:
        condition: service_healthy

  classifier:
    build:
      context: .
      args:
        HTTPS_PROXY: ${BUILD_PROXY:-}
        HTTP_PROXY: ${BUILD_PROXY:-}
    restart: unless-stopped
    environment:
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: ${LLM_MODEL:?set LLM_MODEL in .env}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-none}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-400}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-120s}
      CLASSIFY_LANGUAGE: ${CLASSIFY_LANGUAGE:-English}
      MAX_INPUT_CHARS: ${MAX_INPUT_CHARS:-4000}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-2}
      MAX_CONCURRENT: ${MAX_CONCURRENT:-1}
      QUEUE_WAIT: ${QUEUE_WAIT:-30s}
      NO_PROXY: ollama
    depends_on:
      ollama:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${CLASSIFIER_PORT:-8080}:8080"

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - classifier

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  ollama-models:
  prometheus-data:
  grafana-data:
